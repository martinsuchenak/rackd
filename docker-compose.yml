version: '3.8'

services:
  rackd:
    build:
      context: .
      # Set RACKD_VERSION and RACKD_COMMIT so `rackd version` reports the build, e.g.
      # RACKD_VERSION=$(git describe --tags --always) RACKD_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        VERSION: ${RACKD_VERSION:-dev}
        COMMIT: ${RACKD_COMMIT:-unknown}
    ports:
      - "8080:8080"
    volumes:
      - rackd-data:/data
    environment:
      - DATA_DIR=/data
      - LISTEN_ADDR=:8080
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DISCOVERY_INTERVAL=24h
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  rackd-data:
