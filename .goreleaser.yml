version: 2

before:
  hooks:
    - task ui:build

builds:
  - id: rackd
    main: .
    binary: rackd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple, on the Linux runner (GoReleaser's cross-platform signer, quill),
# before they are archived. Skipped unless the MACOS_* secrets are set, so a
# fork or a local snapshot builds without them. Setup: docs/releasing.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [rackd]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

# SPDX JSON software bill of materials for each archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless cosign signatures (GitHub OIDC). The checksum file covers every archive;
# SBOMs are signed separately. Verify with `cosign verify-blob --bundle`.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
  - id: sbom
    cmd: cosign
    artifacts: sbom
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Multi-arch image on GitHub's container registry, from the release binaries.
dockers_v2:
  - id: rackd
    ids: [rackd]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/martinsuchenak/rackd
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: rackd
      org.opencontainers.image.description: "Device inventory and IPAM management"
      org.opencontainers.image.source: "https://github.com/martinsuchenak/rackd"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

# Keyless cosign signatures for the images, like the archives. Verify with
# `cosign verify ghcr.io/martinsuchenak/rackd:<version>
#  --certificate-identity-regexp 'https://github.com/martinsuchenak/rackd/'
#  --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: rackd
    repository:
      owner: martinsuchenak
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/martinsuchenak/rackd"
    description: "Device inventory and IPAM management"
    binaries:
      - rackd
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rackd"]
          end
