version: 2

# Minor and patch updates are grouped per ecosystem to keep the pull request
# count low; major updates arrive on their own.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # bun.lock is the lockfile the build and CI use (bun install --frozen-lockfile).
  - package-ecosystem: bun
    directory: /webui
    schedule:
      interval: weekly
    groups:
      webui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
