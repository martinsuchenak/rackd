name: goreleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Keyless cosign signing and build provenance attestations use the workflow's OIDC token.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    # Pinned so runner image migrations don't change release builds unannounced.
    runs-on: ubuntu-24.04
    env:
      # Cloudflare Pages deploy hook for rackd-web (see last step).
      CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Build UI Assets
        run: task ui:build

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          if ./scripts/changelog-section.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"; then
            echo "args=--release-notes=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; falling back to GoReleaser's generated changelog"
          fi

      - name: Delete release
        run: gh release delete ${{ github.ref_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      # Rebuild getrackd.dev so its changelog page picks up this release.
      # Skipped if the CF_PAGES_DEPLOY_HOOK secret is removed.
      - name: Trigger website rebuild
        if: ${{ env.CF_PAGES_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null
