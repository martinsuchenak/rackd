name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'
  TASK_VERSION: 'v3.53.1'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOVULNCHECK_VERSION: 'v1.8.0'
  RACKD_BCRYPT_COST: '6'

jobs:
  go:
    name: Go (fmt, vet, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal main.go)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: task vet

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          task lint

      - name: Test
        run: go test ./... -count=1

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  # Storage code written on xdal must behave the same on every backend the
  # plan supports. The TestDialect* tests run on SQLite in the main job; this
  # one runs them on PostgreSQL and MySQL 8 too, and fails if either is
  # missing rather than skipping it.
  dialects:
    name: Go (storage on PostgreSQL and MySQL)
    runs-on: ubuntu-24.04
    env:
      XDAL_TEST_POSTGRES_DSN: postgres://rackd:testpass@localhost:15432/rackd_test?sslmode=disable
      XDAL_TEST_MYSQL_DSN: root:testpass@tcp(localhost:13306)/rackd_test?parseTime=true
      XDAL_TEST_REQUIRE: postgres,mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      # The run covers every package, and internal/ui embeds the built assets.
      - name: Build UI assets
        run: task ui:build

      # The same databases, with the same settings, as task test:dialects.
      - name: Start PostgreSQL and MySQL
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Test storage on every backend
        run: go test -run Dialect -count=1 -v ./...

      # Every test on each server backend: the storage suite, and the service,
      # API and worker tests through storagetest. Tests of something only
      # SQLite has skip themselves.
      - name: All tests on PostgreSQL
        env:
          RACKD_TEST_BACKEND: postgres
        run: go test -count=1 -timeout 30m ./...

      - name: All tests on MySQL
        env:
          RACKD_TEST_BACKEND: mysql
        run: go test -count=1 -timeout 30m ./...

  race:
    name: Go (race detector)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 30m

  # The release builds every platform; catch a build that breaks on one
  # before a tag, not after it. One job per target, in parallel: building all
  # five in one job took longer than the race tests. linux/amd64 is the
  # tests' own platform.
  cross:
    name: Go (cross-compile ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Cross-compile
        env:
          TARGET: ${{ matrix.target }}
        run: GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -o /dev/null .

  webui:
    name: Web UI (typecheck, API types, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check types against the OpenAPI spec
        run: bun run validate:types

      - name: Unit tests
        run: bun test

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t rackd:ci .
