name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.2'
  TASK_VERSION: 'v3.53.1'
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GOVULNCHECK_VERSION: 'v1.8.0'
  RACKD_BCRYPT_COST: '6'

jobs:
  go:
    name: Go (fmt, vet, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal main.go)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: task vet

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          task lint

      - name: Test
        run: go test ./... -count=1

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  race:
    name: Go (race detector)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 30m

  # The release builds every platform; catch a build that breaks on one
  # before a tag, not after it. One job per target, in parallel: building all
  # five in one job took longer than the race tests. linux/amd64 is the
  # tests' own platform.
  cross:
    name: Go (cross-compile ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build UI assets
        run: task ui:build

      - name: Cross-compile
        env:
          TARGET: ${{ matrix.target }}
        run: GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -o /dev/null .

  webui:
    name: Web UI (typecheck, API types, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check types against the OpenAPI spec
        run: bun run validate:types

      - name: Unit tests
        run: bun test

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t rackd:ci .
