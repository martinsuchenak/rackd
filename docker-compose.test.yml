# Databases for `task test:dialects` and CI's backend job, which run the
# storage tests on PostgreSQL and MySQL as well as SQLite. Not used by rackd
# itself. Uses the same ports as xdal's test databases, so only one of the two
# sets can be up at a time (either works).
services:
  postgres:
    image: postgres:16
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: rackd
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: rackd_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rackd -d rackd_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    # Test data is thrown away: keep it in memory and skip disk syncs, which
    # makes the schema each test creates several times faster.
    tmpfs:
      - /var/lib/mysql
    command: ["--innodb-flush-log-at-trx-commit=0", "--sync-binlog=0", "--skip-log-bin", "--innodb-doublewrite=0"]
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: rackd_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptestpass"]
      interval: 3s
      timeout: 3s
      retries: 20
